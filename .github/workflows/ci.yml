name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels an in-flight run for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported (requires-python >=3.10) and current
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installs exactly what a user gets from `pip install stormscape` (plus
      # pytest), so CI exercises the real install path. The suite is offline, and
      # the optional stack (Py-ART / wradlib / nexradaws / contextily / GDAL's PDF
      # driver) is deliberately absent: those are lazily imported, and the tests
      # needing them are marked `optional_deps` and skip themselves.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Show environment
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import rasterio, geopandas, numpy, scipy; \
            print('rasterio', rasterio.__version__, '| GDAL', rasterio.__gdal_version__); \
            print('geopandas', geopandas.__version__, '| numpy', numpy.__version__, \
                  '| scipy', scipy.__version__)"

      # Guards the lazy-import contract: the package must import, and every
      # subcommand's parser must build, with none of the optional radar stack
      # installed. Catches a stray module-level `import pyart` immediately.
      - name: Import and CLI smoke test
        run: |
          python -c "import stormscape; print('import OK', stormscape.__version__)"
          python -m stormscape --help > /dev/null
          python -m stormscape export --help > /dev/null

      - name: Run tests
        run: pytest -ra -m "not network" --durations=10
